# Builds QLC+ .deb packages for Raspberry Pi OS Trixie (64-bit), natively on
# GitHub's arm64 runners, using the upstream Debian packaging and create-deb.sh.
#
# Run it from the Actions tab: "Build QLC+ for Pi" -> "Run workflow".

name: Build QLC+ for Pi

on:
  workflow_dispatch:
    inputs:
      qlc_tag:
        description: Git tag or branch to build (e.g. QLC+_5.3.0, master, or a fork's branch)
        required: true
        default: QLC+_5.3.0
      qlc_repo:
        description: GitHub repo to build from (owner/name); change only to test a fork
        required: true
        default: mcallegari/qlcplus
      flavour:
        description: v5 = QML UI (qlcplus5), v4 = widget UI (qlcplus)
        type: choice
        options: [v5, v4]
        default: v5
      patches:
        description: Patches from this repo's patches/ folder to apply, space-separated (empty = none)
        required: false
        default: ''
      publish_release:
        description: Publish the packages as a GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

env:
  ARTIFACT: qlcplus-${{ inputs.flavour }}-trixie-arm64

# Explicit bash gives -eo pipefail, so a failed build isn't hidden by tee.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      QLC_TAG: ${{ inputs.qlc_tag }}
      QLC_REPO: ${{ inputs.qlc_repo }}
      FLAVOUR: ${{ inputs.flavour }}
      PATCHES: ${{ inputs.patches }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential devscripts equivs fakeroot

      - name: Fetch source
        run: |
          git clone --depth 1 --branch "$QLC_TAG" \
            "https://github.com/$QLC_REPO.git" "$GITHUB_WORKSPACE/src"
          git -C "$GITHUB_WORKSPACE/src" log -1 \
            --format="Building $QLC_REPO $QLC_TAG at %H (%cd)%n%s" | tee "$GITHUB_WORKSPACE/SOURCE.txt"

      - name: Check out this repo (for patches)
        if: ${{ inputs.patches != '' }}
        uses: actions/checkout@v5
        with:
          path: pibuild

      - name: Apply patches
        if: ${{ inputs.patches != '' }}
        run: |
          for p in $PATCHES; do
            f="$GITHUB_WORKSPACE/pibuild/patches/$p"
            test -f "$f" || { echo "::error::no such patch: patches/$p"; exit 1; }
            echo "Applying $p"
            git -C "$GITHUB_WORKSPACE/src" apply --verbose "$f"
            echo "Patch: $p ($(sha256sum "$f" | cut -c1-12))" >> "$GITHUB_WORKSPACE/SOURCE.txt"
          done
          git -C "$GITHUB_WORKSPACE/src" diff --stat

      - name: Install build dependencies from debian/control
        # Run outside the source tree so mk-build-deps leftovers don't end up
        # in the source package.
        run: |
          mkdir -p /tmp/deps && cd /tmp/deps
          mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' \
            "$GITHUB_WORKSPACE/src/debian/control"
          # Needed by the 5.3.0 CMake files but missing from upstream's
          # debian/control: cmake itself, Qt Svg, and lrelease/lupdate
          # (Debian ships those in qt6-l10n-tools).
          apt-get install -y --no-install-recommends \
            cmake qt6-svg-dev qt6-l10n-tools

      # Non-release builds (branches, forks) get their own package version and
      # changelog date. Without this every build of a branch shares the
      # upstream version, apt treats them as the same package, and because
      # Debian pins file timestamps to the changelog date (reproducible builds)
      # Qt's on-disk QML cache keeps serving the QML of an older build.
      # "~" sorts below the upstream version, so the real release replaces it.
      # Patched builds of a release get "+p..." instead (see below).
      - name: Give non-release builds a unique version
        if: ${{ !startsWith(inputs.qlc_tag, 'QLC+_') || inputs.patches != '' }}
        working-directory: src
        run: |
          CL="debian/changelog-$FLAVOUR"
          PKG=$(dpkg-parsechangelog -l "$CL" -SSource)
          UP=$(dpkg-parsechangelog -l "$CL" -SVersion)
          SHA=$(git rev-parse --short HEAD)
          NEWVER="${UP%%-*}~git$(date -u +%Y%m%d%H%M).${SHA}"
          if [ -n "$PATCHES" ]; then
            # patch names, reduced to characters allowed in a Debian version
            PN=$(echo $PATCHES | sed -e 's/\.patch//g' | tr -c 'A-Za-z0-9\n' '.' | tr -d '\n')
            case "$QLC_TAG" in
              # a patched release sorts above the plain release ("+"), so it
              # installs over it, and below the next upstream version
              QLC+_*) NEWVER="${UP%%-*}+p$(date -u +%Y%m%d%H%M).${PN}" ;;
              *)      NEWVER="${NEWVER}.p.${PN}" ;;
            esac
          fi
          # written by hand: dch refuses upstream's changelog while its newest
          # entry has no change lines yet
          { printf '%s (%s) stable; urgency=low\n\n  * Test build of %s %s at %s\n\n -- qlcplus-pi-build <noreply@github.com>  %s\n\n' \
              "$PKG" "$NEWVER" "$QLC_REPO" "$QLC_TAG${PATCHES:+ with patches: $PATCHES}" "$SHA" "$(date -R)"; cat "$CL"; } > "$CL.new"
          mv "$CL.new" "$CL"
          head -6 "$CL"
          test "$(dpkg-parsechangelog -l "$CL" -SVersion)" = "$NEWVER"

      - name: Build packages
        working-directory: src
        run: ./create-deb.sh "$FLAVOUR" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Job logs live on a storage host that isn't always reachable, so also
      # put the end of the build log in an annotation (readable via the API).
      - name: Report build failure
        if: failure()
        run: |
          [ -f "$GITHUB_WORKSPACE/build.log" ] || exit 0
          msg=$(tail -n 60 "$GITHUB_WORKSPACE/build.log" \
                | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build log tail::$msg"

      - name: Collect packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$GITHUB_WORKSPACE"
          mv ./*.deb out/
          cp ./*.buildinfo out/ 2>/dev/null || true
          cp SOURCE.txt out/
          cd out
          # GitHub turns "~" in asset names into ".": do it here, so the
          # names in SHA256SUMS match the published files
          for f in *~*; do [ -e "$f" ] && mv "$f" "${f//\~/.}"; done
          sha256sum ./*.deb > SHA256SUMS
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: out/
          if-no-files-found: error

  # Install the packages into a clean Trixie arm64 system and check that every
  # library resolves and the binary starts.
  smoke-test:
    needs: build
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
      FLAVOUR: ${{ inputs.flavour }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}
          path: out

      - name: Install packages
        run: |
          apt-get update
          apt-get install -y ./out/*.deb

      - name: Check libraries and startup
        run: |
          if [ "$FLAVOUR" = v5 ]; then BIN=qlcplus5; else BIN=qlcplus; fi
          echo "Checking $BIN and its plugins for missing libraries"
          missing=$( { ldd "$(command -v $BIN)"; \
                       find /usr/lib -path '*qlcplus*' -name '*.so' -exec ldd {} \; ; } \
                     | grep 'not found' || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          QT_QPA_PLATFORM=offscreen timeout 60 "$BIN" --version

  release:
    needs: smoke-test
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      QLC_TAG: ${{ inputs.qlc_tag }}
      QLC_REPO: ${{ inputs.qlc_repo }}
      FLAVOUR: ${{ inputs.flavour }}
      PATCHES: ${{ inputs.patches }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT }}
          path: out

      - name: Create or update release
        run: |
          # Package version comes from the source's debian changelog, not the tag
          DEB=$(ls out/qlcplus-data_*_all.deb)
          VER=$(basename "$DEB" | sed -E 's/^qlcplus-data_(.*)_all\.deb$/\1/')
          if [ "$FLAVOUR" = v5 ]; then PKG=qlcplus5; else PKG=qlcplus; fi
          # Release label: the tag/branch, prefixed with the owner for non-upstream repos
          LABEL=$(echo "${QLC_TAG#QLC+_}" | tr '/' '-')
          PRE=""
          if [ "$QLC_REPO" != mcallegari/qlcplus ]; then LABEL="${QLC_REPO%%/*}-$LABEL"; fi
          case "$QLC_TAG" in QLC+_*) ;; *) PRE="--prerelease" ;; esac
          if [ -n "$PATCHES" ]; then
            LABEL="${LABEL}-patched-$(echo $PATCHES | sed -e 's/\.patch//g' | tr -c 'A-Za-z0-9\n' '-' | tr -d '\n')"
            PRE="--prerelease"
          fi
          REL="qlcplus-${FLAVOUR}-${LABEL}-trixie-arm64"
          if gh release view "$REL" --repo "$REPO" >/dev/null 2>&1; then
            # drop the previous build's files: new versions have new file names
            gh release view "$REL" --repo "$REPO" --json assets --jq '.assets[].name' |
              while read -r a; do gh release delete-asset "$REL" "$a" --repo "$REPO" --yes; done
            gh release upload "$REL" out/* --repo "$REPO" --clobber
          else
            gh release create "$REL" out/* --repo "$REPO" $PRE \
              --title "QLC+ $VER ($FLAVOUR) from $QLC_REPO $QLC_TAG, Raspberry Pi OS Trixie arm64" \
              --notes "Built from \`$QLC_REPO\` \`$QLC_TAG\` (exact commit in SOURCE.txt) with upstream create-deb.sh on a native arm64 runner. Version ${VER}. Install with: sudo apt install --no-install-recommends ./qlcplus-data_*_all.deb ./${PKG}_*_arm64.deb qt6-svg-plugins qt6-wayland (skip the -dbgsym package unless debugging). Branch, fork and patched builds get a unique ~git version, so a plain install upgrades them.${PATCHES:+ Patches applied (see SOURCE.txt): $PATCHES}"
          fi
